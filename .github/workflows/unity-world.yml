name: Unity world quality gate

on:
  push:
    branches: [unity-world]
  pull_request:
    branches: [unity-world]

jobs:
  world-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cape Crown world dependencies
        run: bash scripts/ci/unity-world-preflight.sh
